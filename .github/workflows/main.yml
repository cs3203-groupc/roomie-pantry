name: RoomiePantry CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          mkdir -p data
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run test suite
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          PORT: 3000
          DB_TYPE: sqlite
          SQLITE_DB_PATH: ./data/pantry.test.sqlite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-test-key' }}
